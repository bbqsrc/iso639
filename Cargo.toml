[workspace]
members = ["iso639-cli", "iso639-wasm"]
resolver = "3"

[workspace.package]
version = "0.4.0"
authors = ["Brendan Molloy <brendan@bbqsrc.net>"]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/bbqsrc/iso639"
license = "MIT OR Apache-2.0"

[package]
name = "iso639"
description = "Autonyms, default scripts and LCIDs for BCP 47 language tags"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
# The library and the tables it is built from; js/ and iso639-wasm/ are the
# npm package's.
include = [
    "/src",
    "/build.rs",
    "/tests",
    "/LICENSE-*",
    "/iso639-databases/*.tsv",
    "/iso639-databases/LICENSE",
]

[build-dependencies]
csv = "1.4.0"

[profile.release]
lto = "fat"

# The npm package's build (js/build.mjs): small over fast, since every user
# downloads it. wasm-opt drops the function names after.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
codegen-units = 1
strip = "debuginfo"
