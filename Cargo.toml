[workspace]
members = ["iso639-cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
authors = ["Brendan Molloy <brendan@bbqsrc.net>"]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/bbqsrc/iso639"
license = "MIT OR Apache-2.0"

[package]
name = "iso639"
description = "Library for manipulating ISO639-1 and -3 tags, autonyms and data"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
phf = "0.14.0"

[build-dependencies]
phf_codegen = "0.14.0"
csv = "1.4.0"

[profile.release]
lto = "fat"
