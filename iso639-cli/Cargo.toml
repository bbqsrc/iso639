[package]
name = "iso639-cli"
description = "Command line tool for autonyms, default scripts and LCIDs of BCP 47 language tags"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "iso639"
path = "src/main.rs"

[dependencies]
iso639 = { path = "..", version = "0.3.0" }
clap = { version = "4.6.7", features = ["derive"] }
